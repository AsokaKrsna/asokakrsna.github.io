<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Editor</title>
<link rel="icon" href="images/AsokaKrsna.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f17;--surface:#111827;--surface-2:#172131;--border:#1f2a3a;--border-hover:#33445c;
  --text:#e2e8f0;--dim:#94a3b8;--muted:#64748b;--accent:#64ffda;--accent-dim:rgba(100,255,218,.12);
  --danger:#f87171;--danger-dim:rgba(248,113,113,.12);--warn:#fbbf24;--warn-dim:rgba(251,191,36,.1);--ok:#34d399;
  --radius:8px;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;font-size:14px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sign-in */
#signin{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.signin-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center}
.signin-card h1{font:600 1.1rem var(--mono);color:var(--accent);margin-bottom:.4rem}
.signin-card p{color:var(--dim);font-size:.85rem;margin-bottom:1.4rem}
.gh-btn{display:inline-flex;align-items:center;gap:.6rem;background:#f0f6fc;color:#0d1117;border:0;border-radius:8px;padding:.7rem 1.1rem;font-weight:600}
.gh-btn:hover{background:#fff}
.gh-btn svg{width:18px;height:18px}
.signin-alt{margin-top:1rem;font-size:.78rem;color:var(--muted)}
.signin-alt button{background:none;border:0;color:var(--dim);text-decoration:underline}
.signin-err{color:var(--danger);font-size:.8rem;margin-top:.8rem;min-height:1em}

/* app shell */
#app{display:none}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar .title{font:600 .82rem var(--mono);color:var(--accent);white-space:nowrap}
.topbar .who{display:flex;align-items:center;gap:.45rem;color:var(--dim);font-size:.78rem;margin-left:.4rem}
.topbar .who img{width:22px;height:22px;border-radius:50%}
.topbar .spacer{flex:1}
.status{display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.dirty{background:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .8rem;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.8rem;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--border-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#06251d}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--danger-dim)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn-sm{padding:.28rem .55rem;font-size:.74rem}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 49px)}
.layout.with-preview{grid-template-columns:230px minmax(0,1fr) minmax(0,1fr)}
.sidebar{border-right:1px solid var(--border);padding:1rem .6rem;position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto}
.sidebar .group{font:600 .65rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:1rem .6rem .35rem}
.sidebar .group:first-child{margin-top:0}
.sidebar a{display:flex;justify-content:space-between;align-items:center;padding:.38rem .6rem;border-radius:6px;color:var(--dim);text-decoration:none;font-size:.84rem}
.sidebar a:hover{background:var(--surface);color:var(--text)}
.sidebar a.active{background:var(--accent-dim);color:var(--accent)}
.sidebar .count{font:500 .68rem var(--mono);color:var(--muted)}
.sidebar .warn-badge{font:600 .65rem var(--mono);color:var(--warn)}
.content{padding:1.4rem 1.6rem 5rem;max-width:880px;width:100%}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.1rem}
.panel-head h2{font:600 1.05rem var(--sans)}
.panel-head p{color:var(--dim);font-size:.82rem;margin-top:.2rem;max-width:60ch}
.where{display:inline-block;font:500 .66rem var(--mono);padding:.12rem .4rem;border-radius:4px;background:var(--surface-2);color:var(--dim);margin-left:.4rem;vertical-align:middle}

.field{margin-bottom:.9rem}
.field>label,.field .lbl{display:block;font-size:.74rem;font-weight:600;color:var(--dim);margin-bottom:.3rem}
.field input[type=text],.field input[type=url],.field input[type=email],.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.5rem .65rem;font:inherit;font-size:.86rem}
.field textarea{resize:vertical;min-height:2.6rem;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field small{display:block;color:var(--muted);font-size:.72rem;margin-top:.25rem}
.field.invalid input,.field.invalid textarea{border-color:var(--warn)}
.check{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--dim);margin-bottom:.9rem;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 .8rem}

.items{display:flex;flex-direction:column;gap:.5rem}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.item-head{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;cursor:pointer;user-select:none}
.item-head .chev{color:var(--muted);transition:transform .15s;font-size:.7rem;width:.8rem}
.item.open .item-head .chev{transform:rotate(90deg)}
.item-head .t{flex:1;min-width:0;font-size:.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .sub{font:500 .7rem var(--mono);color:var(--muted);white-space:nowrap}
.item-head .pill{font:600 .62rem var(--mono);padding:.12rem .35rem;border-radius:4px;background:var(--surface-2);color:var(--dim)}
.item-head .pill.off{color:var(--muted);text-decoration:line-through}
.item-body{display:none;padding:.4rem .9rem .3rem;border-top:1px solid var(--border)}
.item.open .item-body{display:block}
.add-row{margin-top:.6rem}
.strings{display:flex;flex-direction:column;gap:.35rem}
.string{display:flex;gap:.35rem;align-items:flex-start}
.string input,.string textarea{flex:1}

.banner{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem .9rem;border-radius:8px;margin-bottom:1rem;font-size:.82rem}
.banner.warn{background:var(--warn-dim);border:1px solid rgba(251,191,36,.3);color:#fde68a}
.banner.info{background:var(--accent-dim);border:1px solid rgba(100,255,218,.25);color:#b5fff0}
.banner .spacer{flex:1}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem;margin-bottom:1.2rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem}
.card h3{font-size:.85rem;margin-bottom:.35rem}
.card p{color:var(--dim);font-size:.8rem;margin-bottom:.7rem}
.warnings li{list-style:none;padding:.45rem .6rem;border-left:2px solid var(--warn);background:var(--warn-dim);border-radius:0 6px 6px 0;margin-bottom:.35rem;font-size:.8rem;cursor:pointer}
.warnings li:hover{filter:brightness(1.15)}
.warnings .ok{border-color:var(--ok);background:rgba(52,211,153,.08);cursor:default}

.preview{border-left:1px solid var(--border);position:sticky;top:49px;height:calc(100vh - 49px);display:none;flex-direction:column}
.layout.with-preview .preview{display:flex}
.preview-head{display:flex;gap:.3rem;align-items:center;padding:.45rem .6rem;border-bottom:1px solid var(--border)}
.preview-head .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);padding:.3rem .6rem;font-size:.74rem}
.seg button.on{background:var(--accent-dim);color:var(--accent)}
.preview iframe{flex:1;border:0;background:#fff;width:100%}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:640px;max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.3rem}
.modal h3{font-size:1rem;margin-bottom:.8rem}
.modal .actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
.diff{font:400 .75rem/1.5 var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.6rem .7rem;max-height:40vh;overflow:auto}
.diff div{white-space:pre-wrap;word-break:break-word;padding:.1rem 0}
.diff .k{color:var(--accent)}
.diff .del{color:var(--danger)}
.diff .add{color:var(--ok)}
textarea.json{width:100%;height:55vh;background:var(--bg);color:var(--accent);border:1px solid var(--border);border-radius:6px;font:400 .74rem/1.5 var(--mono);padding:.6rem}

.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(150%);background:var(--surface-2);border:1px solid var(--border);padding:.6rem 1rem;border-radius:8px;font-size:.82rem;z-index:200;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--ok)}
.toast.err{border-color:var(--danger)}

.menu-btn{display:none}
@media (max-width:860px){
  .layout,.layout.with-preview{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:49px;width:250px;z-index:40;background:var(--bg);transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .content{padding:1rem 1rem 5rem}
  .preview{position:fixed;inset:49px 0 0 0;z-index:45;background:var(--bg)}
  .topbar .who span,.status span{display:none}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<!-- ───────── Sign in ───────── -->
<div id="signin">
  <div class="signin-card">
    <h1>[ portfolio editor ]</h1>
    <p>Sign in with the GitHub account that owns the site repository. Your token stays in this browser tab only.</p>
    <button class="gh-btn" id="gh-login" type="button">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Sign in with GitHub
    </button>
    <div class="signin-err" id="signin-err"></div>
    <div class="signin-alt">or <button type="button" id="offline-btn">open read-only</button> (edit, preview and download JSON without committing)</div>
  </div>
</div>

<!-- ───────── App ───────── -->
<div id="app">
  <div class="topbar">
    <button class="btn btn-ghost btn-sm menu-btn" id="menu-btn" type="button" aria-label="Sections">☰</button>
    <div class="title">┌─[ editor ]</div>
    <div class="who" id="who"></div>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status-msg">Up to date</span></div>
    <button class="btn btn-ghost btn-sm hide-sm" type="button" onclick="App.showJSON()">{ } JSON</button>
    <button class="btn btn-ghost btn-sm hide-sm" type="button" onclick="App.download()">↓ JSON</button>
    <button class="btn btn-sm" type="button" id="preview-btn" onclick="App.togglePreview()">Preview</button>
    <button class="btn btn-primary btn-sm" type="button" id="publish-btn" onclick="App.openPublish()">Publish</button>
  </div>
  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="content" id="content"></div>
    <aside class="preview" id="preview">
      <div class="preview-head">
        <div class="seg" id="preview-seg">
          <button type="button" class="on" data-page="index.html">Academic</button>
          <button type="button" data-page="nerd.html">Nerd</button>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" type="button" onclick="App.reloadPreview()">↻</button>
        <button class="btn btn-ghost btn-sm" type="button" onclick="App.togglePreview()">✕</button>
      </div>
      <iframe id="preview-frame" title="Live preview"></iframe>
    </aside>
  </div>
</div>

<!-- Publish modal -->
<div class="modal-bg" id="publish-modal">
  <div class="modal">
    <h3>Publish changes</h3>
    <div id="publish-body"></div>
    <div class="field" style="margin-top:.9rem"><label for="commit-msg">Commit message</label><input type="text" id="commit-msg"></div>
    <div class="actions">
      <button class="btn" type="button" onclick="App.closeModal('publish-modal')">Cancel</button>
      <button class="btn btn-primary" type="button" id="commit-btn" onclick="App.commit()">Commit to GitHub</button>
    </div>
  </div>
</div>
<!-- JSON modal -->
<div class="modal-bg" id="json-modal">
  <div class="modal">
    <h3>Raw JSON</h3>
    <textarea class="json" id="json-area" readonly></textarea>
    <div class="actions">
      <button class="btn" type="button" onclick="App.closeModal('json-modal')">Close</button>
      <button class="btn btn-primary" type="button" onclick="App.copyJSON()">Copy</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Portfolio editor
   - Sign-in: GitHub OAuth via the sveltia-cms-auth Cloudflare Worker (Decap-compatible popup flow)
   - Reads/writes data/portfolio-data.json through the GitHub contents API
   - The "Build academic page" workflow regenerates index.html after each commit
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  authBase: 'https://sveltia-cms-auth.durjoymajumdar02.workers.dev',
  repo: 'AsokaKrsna/asokakrsna.github.io',
  branch: 'main',
  dataPath: 'data/portfolio-data.json',
  cvPaths: ['CV.pdf', 'Resume.pdf'],
};
const TOKEN_KEY = 'cms-gh-token';
const DRAFT_KEY = 'cms-draft-v2';

/* ───────── Field schema ─────────
   type: text | url | textarea | html | select | bool | strings | htmlStrings | csv | objects
   For objects: item = [fields], title = fn(item) | key, template = {} */
const T = (key, label, extra = {}) => ({ key, label, type: 'text', ...extra });
const U = (key, label, extra = {}) => ({ key, label, type: 'url', ...extra });
const A = (key, label, extra = {}) => ({ key, label, type: 'textarea', ...extra });
const H = (key, label, extra = {}) => ({ key, label, type: 'html', ...extra });
const B = (key, label, extra = {}) => ({ key, label, type: 'bool', ...extra });
const S = (key, label, options, extra = {}) => ({ key, label, type: 'select', options, ...extra });
const ROW = (...fields) => ({ type: 'row', fields });

const PANELS = [
  { group: 'Site' },
  { id: 'dashboard', label: 'Dashboard', special: 'dashboard' },

  { group: 'Academic page' },
  { id: 'classic', label: 'Header & bio', where: 'Academic', path: 'classic', fields: [
    T('role', 'Role line', { help: 'Shown under your name, e.g. "M.Tech student and Junior Researcher, Cybersecurity Lab, IIT Patna"' }),
    T('seekingText', 'Seeking line', { help: 'Green status line. Leave empty to hide.' }),
    { key: 'bio', label: 'Bio paragraphs', type: 'htmlStrings', help: 'Links allowed: <a href="...">text</a>, <em>, <strong>' },
    A('practice', 'CTF / practice line', { help: 'One line under Service & leadership' }),
    T('printHeader', 'Print header'),
    { key: 'sidebarAffiliations', label: 'Affiliations (fallback role)', type: 'strings' },
  ]},
  { id: 'news', label: 'News', where: 'Academic', path: 'classic.news', type: 'objects',
    title: (n) => stripTags(n.text), sub: (n) => n.date, template: { date: '', text: '' },
    help: 'Newest first. The first 6 show; the rest fold into "Older news".',
    item: [T('date', 'Date', { help: 'e.g. Nov 2026 or 2026' }), H('text', 'Text')] },
  { id: 'currentWork', label: 'Current work', where: 'Academic', path: 'classic.currentWork', type: 'objects',
    title: 'title', template: { title: '', text: '' },
    help: 'Ongoing projects. Only put here what you are comfortable making public.',
    item: [T('title', 'Title'), H('text', 'Description')] },
  { id: 'honors', label: 'Honours', where: 'Academic', path: 'classic.honors', type: 'objects',
    title: 'text', sub: (h) => h.year, template: { year: '', text: '' },
    help: 'State facts and selection rates; avoid superlatives.',
    item: [T('year', 'Year'), A('text', 'Honour')] },

  { group: 'Shared content' },
  { id: 'research', label: 'Publications', where: 'Both', path: 'research', type: 'objects',
    title: 'title', sub: (p) => [p.year, p.status].filter(Boolean).join(' · '),
    template: { title: '', authors: 'D. Majumdar', venue: '', publication: '', year: '', date: '', status: 'published', type: 'published', url: '', doi: '', pdf: '', code: '', tldr: '', description: '', yourRole: '', impactArea: '' },
    help: 'Never add manuscripts that are confidential until they are public.',
    item: [
      T('title', 'Title'),
      T('authors', 'Authors', { help: 'As on the paper, e.g. "S. Arjun, D. Majumdar". Your name is bolded automatically.' }),
      ROW(S('status', 'Status', ['published', 'preprint', 'under review']), T('year', 'Year'), T('date', 'Date (Nerd Mode)')),
      T('venue', 'Venue (full name)', { help: 'Academic page' }),
      T('publication', 'Venue (short, Nerd Mode)', { help: 'e.g. IEEE ISCS 2024' }),
      ROW(U('url', 'Paper URL'), T('doi', 'DOI')),
      ROW(U('pdf', 'PDF URL'), U('code', 'Code URL')),
      T('tldr', 'TL;DR (Nerd Mode)'), A('description', 'Description (Nerd Mode)'),
      ROW(T('yourRole', 'Your role'), T('impactArea', 'Impact area')),
      B('academic', 'Show on the academic page', { default: true }),
    ] },
  { id: 'projects', label: 'Projects', where: 'Both', path: 'projects', type: 'objects',
    title: 'title', pill: (p) => p.academic === true ? (p.category === 'software' ? 'software' : 'project') : null,
    template: { title: '', description: '', technologies: [], githubUrl: '', liveUrl: '', linkText: '', status: '', category: 'project', academic: false },
    help: 'On the academic page, "software" items go under Research software and "project" items under Projects.',
    item: [
      T('title', 'Title'), A('description', 'Description'),
      A('cv', 'CV description (optional)', { help: 'Shorter wording for the PDF CV. Leave empty to reuse the description.' }),
      { key: 'technologies', label: 'Technologies', type: 'csv', help: 'Comma-separated' },
      ROW(U('githubUrl', 'Code URL'), U('liveUrl', 'Live / docs URL')),
      ROW(T('linkText', 'Live link label', { help: 'Default "Site"' }), T('status', 'Badge', { help: 'e.g. Code in limited access' })),
      S('category', 'Academic-page section', ['software', 'project']),
      B('academic', 'Show on the academic page'),
    ] },
  { id: 'experience', label: 'Experience', where: 'Both', path: 'experience', type: 'objects',
    title: (e) => `${e.title || 'New position'} — ${e.company || ''}`, sub: (e) => e.period, pill: (e) => e.kind,
    template: { period: '', title: '', company: '', location: '', kind: 'research', academic: true, responsibilities: [] },
    help: 'Kind decides the academic-page section: research → Research experience, teaching → Teaching, service → Service & leadership.',
    item: [
      ROW(T('title', 'Title'), T('company', 'Organisation')),
      ROW(T('period', 'Period', { help: 'e.g. Nov 2025 - Present' }), T('location', 'Location'), S('kind', 'Kind', ['research', 'teaching', 'service'])),
      { key: 'responsibilities', label: 'Points (outcomes, not duties)', type: 'strings' },
      { key: 'cv', label: 'CV points (optional)', type: 'strings', help: 'Replace the points above on the PDF CV only. Leave empty to reuse them.' },
      B('academic', 'Show on the academic page', { default: true }),
    ] },
  { id: 'education', label: 'Education', where: 'Both', path: 'education', type: 'objects',
    title: 'institution', sub: (e) => e.period, template: { institution: '', degree: '', period: '', location: '', grade: '', details: '' },
    item: [T('institution', 'Institution'), T('degree', 'Degree'), ROW(T('period', 'Period'), T('location', 'Location')),
      T('grade', 'Grade', { help: 'Must match your transcript and CV exactly' }), A('details', 'Details (academic page)')] },
  { id: 'about', label: 'About (Nerd)', where: 'Nerd', path: 'about', fields: [{ key: 'paragraphs', label: 'Paragraphs', type: 'htmlStrings' }] },
  { id: 'researchInterests', label: 'Research focus', where: 'Both', path: 'researchInterests', fields: [
    { key: 'areas', label: 'Areas (chips on the academic page)', type: 'strings', help: 'Keep to about 4.' },

/* ───────── helpers ───────── */
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function stripTags(s) { return String(s ?? '').replace(/<[^>]*>/g, ''); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function getPath(obj, path) {
  if (!path) return obj;
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  let cur = obj;
  keys.slice(0, -1).forEach((k, i) => {
    if (cur[k] == null) cur[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    cur = cur[k];
  });
  cur[keys[keys.length - 1]] = value;
}
function join(...parts) { return parts.filter((p) => p !== '' && p != null).join('.'); }
function b64encodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decodeUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function isValidUrl(u) { return !u || /^(https?:\/\/|mailto:)/i.test(u) || /^[\w./#?=&-]+$/.test(u); }

/* ───────── GitHub ───────── */
const GH = {
  token: null,
  async api(path, opts = {}) {
    const res = await fetch(`https://api.github.com${path}`, {
      ...opts,
      headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${this.token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
    });
    if (!res.ok) {
      let msg = res.status + '';
      try { msg = (await res.json()).message || msg; } catch (e) {}
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return res.status === 204 ? null : res.json();
  },
  getFile(path) { return this.api(`/repos/${CONFIG.repo}/contents/${path}?ref=${encodeURIComponent(CONFIG.branch)}`); },
  async putFile(path, contentB64, message, sha) {
    const body = { message, content: contentB64, branch: CONFIG.branch };
    if (sha) body.sha = sha;
    return this.api(`/repos/${CONFIG.repo}/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
  },
  // Decap/Sveltia-compatible OAuth popup handshake with the auth worker.
  login() {
    return new Promise((resolve, reject) => {
      const site = encodeURIComponent(location.hostname);
      const url = `${CONFIG.authBase}/auth?provider=github&site_id=${site}&scope=repo`;
      const w = 600, h = 720;
      const popup = window.open(url, 'gh-auth', `width=${w},height=${h},left=${(screen.width - w) / 2},top=${(screen.height - h) / 2}`);
      if (!popup) return reject(new Error('Popup blocked. Allow popups for this site and try again.'));
      const authOrigin = new URL(CONFIG.authBase).origin;
      const onMsg = (e) => {
        if (e.origin !== authOrigin || typeof e.data !== 'string') return;
        if (e.data === 'authorizing:github') { popup.postMessage(e.data, e.origin); return; }
        const m = e.data.match(/^authorization:github:(success|error):(.*)$/s);
        if (!m) return;
        cleanup();
        let payload = {};
        try { payload = JSON.parse(m[2]); } catch (err) {}
        if (m[1] === 'success' && payload.token) resolve(payload.token);
        else reject(new Error(payload.message || payload.error || 'GitHub sign-in failed'));
      };
      const timer = setInterval(() => { if (popup.closed) { cleanup(); reject(new Error('Sign-in window closed')); } }, 600);
      const cleanup = () => { window.removeEventListener('message', onMsg); clearInterval(timer); };
      window.addEventListener('message', onMsg);
    });
  },
};

/* ───────── App ───────── */
const App = {
  data: {}, base: {}, sha: null, user: null, readOnly: false, current: 'dashboard', open: new Set(),

  async start(readOnly) {
    this.readOnly = readOnly;
    document.getElementById('signin').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await this.load();
    this.renderSidebar();
    this.show(location.hash.slice(1) || 'dashboard');
  },

  async load() {
    try {
      if (!this.readOnly) {
        const file = await GH.getFile(CONFIG.dataPath);
        this.sha = file.sha;
        this.base = JSON.parse(b64decodeUtf8(file.content));
      } else {
        const res = await fetch(`${CONFIG.dataPath}?t=${Date.now()}`);
        this.base = await res.json();
      }
    } catch (e) {
      toast('Could not load data: ' + e.message, 'err');
      this.base = {};
    }
    this.data = clone(this.base);
    let draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    this.draft = draft && JSON.stringify(draft.data) !== JSON.stringify(this.base) ? draft : null;
    this.updateStatus();
  },

  /* sidebar + routing */
  renderSidebar() {
    const warnings = this.validate();
    const byPanel = {};
    warnings.forEach((w) => { byPanel[w.panel] = (byPanel[w.panel] || 0) + 1; });
    document.getElementById('sidebar').innerHTML = PANELS.map((p) => {
      if (p.group) return `<div class="group">${esc(p.group)}</div>`;
      const arr = p.type === 'objects' ? getPath(this.data, p.path) : null;
      const right = byPanel[p.id] ? `<span class="warn-badge">${byPanel[p.id]}!</span>`
        : (p.id === 'dashboard' && warnings.length ? `<span class="warn-badge">${warnings.length}!</span>`
        : (Array.isArray(arr) ? `<span class="count">${arr.length}</span>` : ''));
      return `<a href="#${p.id}" data-id="${p.id}" class="${p.id === this.current ? 'active' : ''}">${esc(p.label)}${right}</a>`;
    }).join('');
  },

  show(id) {
    const panel = PANELS.find((p) => p.id === id) || PANELS.find((p) => p.id === 'dashboard');
    this.current = panel.id;
    document.querySelectorAll('#sidebar a').forEach((a) => a.classList.toggle('active', a.dataset.id === panel.id));
    document.getElementById('sidebar').classList.remove('open');
    const el = document.getElementById('content');
    el.innerHTML = panel.special === 'dashboard' ? this.renderDashboard() : this.renderPanel(panel);
    if (history.replaceState) history.replaceState(null, '', '#' + panel.id);
  },

  /* dashboard */
  renderDashboard() {
    const warnings = this.validate();
    const changes = diffPaths(this.base, this.data);
    const draftBanner = this.draft ? `<div class="banner warn"><span>You have an unsaved draft from ${new Date(this.draft.savedAt).toLocaleString()}.</span><span class="spacer"></span>
      <button class="btn btn-sm" type="button" onclick="App.restoreDraft()">Restore draft</button><button class="btn btn-ghost btn-sm" type="button" onclick="App.discardDraft()">Discard</button></div>` : '';
    const roBanner = this.readOnly ? `<div class="banner info"><span>Read-only mode: you can edit, preview and download the JSON, but not commit. Sign in with GitHub to publish.</span></div>` : '';
    return `<div class="panel-head"><div><h2>Dashboard</h2><p>Edit a section on the left, check it in Preview, then Publish. The academic page rebuilds on GitHub about a minute after each commit.</p></div></div>
      ${draftBanner}${roBanner}
      <div class="cards">
        <div class="card"><h3>Changes</h3><p>${changes.length ? `${changes.length} field${changes.length > 1 ? 's' : ''} changed since the last commit.` : 'No unpublished changes.'}</p>
          <button class="btn btn-primary btn-sm" type="button" onclick="App.openPublish()" ${changes.length ? '' : 'disabled'}>Review &amp; publish</button></div>
        <div class="card"><h3>CV (PDF)</h3><p>Generated from your data and rebuilt on every publish (edit wording under <em>CV settings</em>). Uploading a PDF overrides it until the next publish.</p>
          <input type="file" id="cv-file" accept="application/pdf" hidden onchange="App.uploadCV(this.files[0])">
          <button class="btn btn-sm" type="button" onclick="document.getElementById('cv-file').click()" ${this.readOnly ? 'disabled' : ''}>Upload PDF</button>
          <a class="btn btn-ghost btn-sm" href="CV.pdf" target="_blank" rel="noopener">View current</a></div>
        <div class="card"><h3>Site</h3><p>Repository <code>${esc(CONFIG.repo)}</code>, branch <code>${esc(CONFIG.branch)}</code>.</p>
          <a class="btn btn-ghost btn-sm" href="./" target="_blank" rel="noopener">Academic ↗</a>
          <a class="btn btn-ghost btn-sm" href="nerd.html" target="_blank" rel="noopener">Nerd ↗</a>
          <a class="btn btn-ghost btn-sm" href="https://github.com/${esc(CONFIG.repo)}/actions" target="_blank" rel="noopener">Builds ↗</a></div>
      </div>
      <h3 style="font-size:.85rem;margin-bottom:.5rem">Checks</h3>
      <ul class="warnings">${warnings.length ? warnings.map((w) => `<li onclick="App.show('${w.panel}')">${esc(w.msg)}</li>`).join('') : '<li class="ok">No problems found.</li>'}</ul>`;
  },

  validate() {
    const d = this.data, out = [];
    const add = (panel, msg) => out.push({ panel, msg });
    (d.research || []).forEach((p, i) => {
      const n = `Publication ${i + 1}${p.title ? ` ("${p.title.slice(0, 40)}…")` : ''}`;
      if (!p.title) add('research', `${n}: missing title.`);
      if (!p.year) add('research', `${n}: missing year.`);
      if (!p.authors) add('research', `${n}: missing authors.`);
      if (!p.venue && !p.publication) add('research', `${n}: missing venue.`);
      if (/under review/i.test(p.status || '') && p.venue) add('research', `${n}: under-review papers should not name a venue.`);
    });
    const urlCheck = (panel, label, u) => { if (u && !isValidUrl(u)) add(panel, `${label}: "${u}" does not look like a URL.`); };
    (d.projects || []).forEach((p) => { urlCheck('projects', p.title, p.githubUrl); urlCheck('projects', p.title, p.liveUrl); });
    (d.socialLinks || []).forEach((s) => urlCheck('socialLinks', s.platform, s.url));
    (d.research || []).forEach((p) => { urlCheck('research', p.title, p.url); urlCheck('research', p.title, p.pdf); });
    // the same grade written two different ways is the most common inconsistency
    const text = JSON.stringify(d);
    const cgpas = new Set([...text.matchAll(/CGPA[^0-9]{0,12}(\d\.\d{1,2})/gi)].map((m) => m[1]));
    if (cgpas.size > 1) add('education', `CGPA appears with different values: ${[...cgpas].join(', ')}.`);
    const words = /(most prestigious|world'?s biggest|biggest|largest|nationalist)/i;
    const hits = [...new Set((text.match(new RegExp(words, 'gi')) || []).map((w) => w.toLowerCase()))];
    if (hits.length) add('dashboard', `Wording academics discount: ${hits.join(', ')}. State the fact and the selection rate instead.`);
    if (d.classic && d.classic.news && d.classic.news.some((n) => !n.date)) add('news', 'A news item has no date.');
    return out;
  },

  /* generic panel renderer */
  renderPanel(panel) {
    const where = panel.where ? `<span class="where">${esc(panel.where)}</span>` : '';
    const head = `<div class="panel-head"><div><h2>${esc(panel.label)}${where}</h2>${panel.help ? `<p>${esc(panel.help)}</p>` : ''}</div></div>`;
    if (panel.type === 'objects') return head + this.renderObjects(panel, panel.path);
    return head + this.renderFields(panel.fields, panel.path);
  },

  renderFields(fields, base) {
    return fields.map((f) => this.renderField(f, base)).join('');
  },

  renderField(f, base) {
    if (f.type === 'row') return `<div class="row">${f.fields.map((x) => this.renderField(x, base)).join('')}</div>`;
    const path = join(base, f.key);
    const v = getPath(this.data, path);
    const help = f.help ? `<small>${esc(f.help)}</small>` : '';
    const id = 'f-' + path.replace(/\W/g, '-');
    switch (f.type) {
      case 'textarea': case 'html':
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" rows="${f.type === 'html' ? 3 : 2}" data-path="${path}">${esc(v)}</textarea>${help}</div>`;
      case 'select':
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" data-path="${path}">${f.options.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>${help}</div>`;
      case 'bool': {
        const checked = v === undefined ? !!f.default : !!v;
        return `<label class="check"><input type="checkbox" data-path="${path}" data-bool="1" ${checked ? 'checked' : ''}>${esc(f.label)}</label>`;
      }
      case 'csv':
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" data-path="${path}" data-csv="1" value="${esc((v || []).join(', '))}">${help}</div>`;
      case 'strings': case 'htmlStrings': {
        const arr = Array.isArray(v) ? v : [];
        const multi = f.type === 'htmlStrings';
        const rows = arr.map((s, i) => `<div class="string">
            ${multi ? `<textarea rows="3" data-path="${path}.${i}">${esc(s)}</textarea>` : `<input type="text" data-path="${path}.${i}" value="${esc(s)}">`}
            ${i > 0 ? `<button class="btn btn-ghost btn-sm" type="button" title="Move up" onclick="App.move('${path}',${i},-1)">↑</button>` : ''}
            <button class="btn btn-danger btn-sm" type="button" title="Remove" onclick="App.remove('${path}',${i})">✕</button></div>`).join('');
        return `<div class="field"><span class="lbl">${esc(f.label)}</span><div class="strings">${rows}</div>${help}
          <button class="btn btn-sm add-row" type="button" onclick="App.addString('${path}')">+ Add</button></div>`;
      }
      case 'objects':
        return `<div class="field"><span class="lbl">${esc(f.label)}</span>${this.renderObjects(f, path)}</div>`;
      default:
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="${f.type === 'url' ? 'url' : 'text'}" id="${id}" data-path="${path}" ${f.type === 'url' ? 'data-url="1"' : ''} value="${esc(v)}">${help}</div>`;
    }
  },

  renderObjects(spec, path) {
    const arr = getPath(this.data, path) || [];
    const titleOf = (it) => (typeof spec.title === 'function' ? spec.title(it) : it[spec.title]) || 'Untitled';
    const items = arr.map((it, i) => {
      const key = `${path}.${i}`;
      const open = this.open.has(key);
      const sub = spec.sub ? spec.sub(it) : '';
      const pill = spec.pill ? spec.pill(it) : null;
      const hidden = it && it.academic === false && spec.item.some((f) => f.key === 'academic');
      return `<div class="item ${open ? 'open' : ''}" data-key="${key}">
        <div class="item-head" onclick="App.toggle('${key}', this)">
          <span class="chev">▶</span><span class="t">${esc(stripTags(titleOf(it)))}</span>
          ${pill ? `<span class="pill">${esc(pill)}</span>` : ''}${hidden && !pill ? '<span class="pill off">academic</span>' : ''}
          ${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
          ${i > 0 ? `<button class="btn btn-ghost btn-sm" type="button" title="Move up" onclick="event.stopPropagation();App.move('${path}',${i},-1)">↑</button>` : ''}
          ${i < arr.length - 1 ? `<button class="btn btn-ghost btn-sm" type="button" title="Move down" onclick="event.stopPropagation();App.move('${path}',${i},1)">↓</button>` : ''}
          <button class="btn btn-danger btn-sm" type="button" title="Delete" onclick="event.stopPropagation();App.remove('${path}',${i},true)">✕</button>
        </div>
        <div class="item-body">${open ? this.renderFields(spec.item, key) : ''}</div>
      </div>`;
    }).join('');
    const tpl = encodeURIComponent(JSON.stringify(spec.template || {}));
    return `<div class="items">${items || '<p style="color:var(--muted);font-size:.8rem">Nothing here yet.</p>'}</div>
      <button class="btn btn-sm add-row" type="button" onclick="App.addObject('${path}','${tpl}')">+ Add</button>`;
  },

  /* edits */
  toggle(key, head) {
    const item = head.parentElement;
    if (this.open.has(key)) { this.open.delete(key); item.classList.remove('open'); return; }
    this.open.add(key);
    const panel = PANELS.find((p) => p.id === this.current);
    const spec = findSpecFor(panel, key);
    item.querySelector('.item-body').innerHTML = this.renderFields(spec.item, key);
    item.classList.add('open');
  },
  rerender() { const y = window.scrollY; this.show(this.current); window.scrollTo(0, y); this.renderSidebar(); },
  addObject(path, tpl) {
    const arr = getPath(this.data, path) || [];
    if (!getPath(this.data, path)) setPath(this.data, path, arr);
    arr.push(JSON.parse(decodeURIComponent(tpl)));
    this.open.add(`${path}.${arr.length - 1}`);
    this.changed(); this.rerender();
  },
  addString(path) {
    const arr = getPath(this.data, path) || [];
    if (!getPath(this.data, path)) setPath(this.data, path, arr);
    arr.push('');
    this.changed(); this.rerender();
  },
  remove(path, i, confirmIt) {
    const arr = getPath(this.data, path);
    if (!arr) return;
    if (confirmIt && !confirm('Delete this item?')) return;
    arr.splice(i, 1);
    this.open = new Set([...this.open].filter((k) => !k.startsWith(path + '.')));
    this.changed(); this.rerender();
  },
  move(path, i, dir) {
    const arr = getPath(this.data, path);
    const j = i + dir;
    if (!arr || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    this.open = new Set([...this.open].filter((k) => !k.startsWith(path + '.')));
    this.changed(); this.rerender();
  },
  onInput(e) {
    const el = e.target;
    const path = el.dataset && el.dataset.path;
    if (!path) return;
    let val = el.value;
    if (el.dataset.bool) val = el.checked;
    else if (el.dataset.csv) val = val.split(',').map((s) => s.trim()).filter(Boolean);
    setPath(this.data, path, val);
    if (el.dataset.url) el.closest('.field').classList.toggle('invalid', !isValidUrl(val));
    // keep the paired legacy field in sync so both pages read the same fact
    const m = path.match(/^research\.(\d+)\.status$/);
    if (m) setPath(this.data, `research.${m[1]}.type`, val === 'under review' ? 'in-review' : val);
    this.changed(true);
  },
  changed(light) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ data: this.data, baseSha: this.sha, savedAt: Date.now() })); } catch (e) {}
      this.pushPreview();
      if (light) this.renderSidebar();
    }, 350);
    this.updateStatus();
  },
  updateStatus() {
    const n = diffPaths(this.base, this.data).length;
    document.getElementById('dot').classList.toggle('dirty', n > 0);
    document.getElementById('status-msg').textContent = n ? `${n} unpublished change${n > 1 ? 's' : ''}` : 'Up to date';
  },
  restoreDraft() {
    if (!this.draft) return;
    if (this.draft.baseSha && this.sha && this.draft.baseSha !== this.sha) {
      if (!confirm('The site data changed on GitHub since this draft was saved. Restoring will overwrite those newer changes when you publish. Restore anyway?')) return;
    }
    this.data = clone(this.draft.data); this.draft = null;
    this.changed(); this.rerender(); toast('Draft restored', 'ok');
  },
  discardDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} this.draft = null; this.rerender(); },

  /* preview */
  togglePreview() {
    const layout = document.getElementById('layout');
    const on = !layout.classList.contains('with-preview');
    layout.classList.toggle('with-preview', on);
    document.getElementById('preview-btn').classList.toggle('btn-primary', on);
    if (on) this.reloadPreview();
  },
  reloadPreview() {
    try { sessionStorage.setItem('portfolio-preview-data', JSON.stringify(this.data)); } catch (e) {}
    const page = document.querySelector('#preview-seg .on').dataset.page;
    document.getElementById('preview-frame').src = `${page}?preview=1&t=${Date.now()}`;
  },
  pushPreview() {
    if (!document.getElementById('layout').classList.contains('with-preview')) return;
    try { sessionStorage.setItem('portfolio-preview-data', JSON.stringify(this.data)); } catch (e) {}
    const f = document.getElementById('preview-frame');
    if (f.contentWindow) f.contentWindow.postMessage({ type: 'livePreviewUpdate', data: clone(this.data) }, location.origin);
  },

  /* publish */
  openPublish() {
    const changes = diffPaths(this.base, this.data);
    const warnings = this.validate();
    const fmt = (v) => v === undefined ? '∅' : (typeof v === 'string' ? v : JSON.stringify(v));
    const cut = (s) => (s.length > 160 ? s.slice(0, 160) + '…' : s);
    document.getElementById('publish-body').innerHTML = (changes.length
      ? `<p style="color:var(--dim);font-size:.82rem;margin-bottom:.5rem">${changes.length} change${changes.length > 1 ? 's' : ''}:</p><div class="diff">${changes.slice(0, 80).map((c) =>
          `<div><span class="k">${esc(c.path)}</span>\n<span class="del">− ${esc(cut(fmt(c.from)))}</span>\n<span class="add">+ ${esc(cut(fmt(c.to)))}</span></div>`).join('')}${changes.length > 80 ? `<div>…and ${changes.length - 80} more</div>` : ''}</div>`
      : '<p style="color:var(--dim)">Nothing to publish.</p>')
      + (warnings.length ? `<div class="banner warn" style="margin-top:.8rem">${warnings.length} check${warnings.length > 1 ? 's' : ''} still flagged on the Dashboard. You can publish anyway.</div>` : '')
      + (this.readOnly ? '<div class="banner info" style="margin-top:.8rem">Read-only mode: download the JSON instead, or sign in to commit.</div>' : '');
    document.getElementById('commit-msg').value = changes.length
      ? `Update ${[...new Set(changes.map((c) => c.path.split('.')[0]))].slice(0, 4).join(', ')} via editor` : '';
    document.getElementById('commit-btn').disabled = !changes.length || this.readOnly;
    document.getElementById('publish-modal').classList.add('show');
  },
  async commit() {
    const btn = document.getElementById('commit-btn');
    const msg = document.getElementById('commit-msg').value.trim() || 'Update portfolio data via editor';
    btn.disabled = true; btn.textContent = 'Committing…';
    try {
      const json = JSON.stringify(this.data, null, 2) + '\n';
      const res = await GH.putFile(CONFIG.dataPath, b64encodeUtf8(json), msg, this.sha);
      this.sha = res.content.sha;
      this.base = clone(this.data);
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      this.closeModal('publish-modal');
      this.updateStatus(); this.rerender();
      toast('Committed. The live site updates in about 1–2 minutes.', 'ok');
    } catch (e) {
      if (e.status === 409 || e.status === 422) toast('The file changed on GitHub since you loaded it. Download your JSON as a backup, then reload.', 'err');
      else toast('Commit failed: ' + e.message, 'err');
    } finally { btn.disabled = false; btn.textContent = 'Commit to GitHub'; }
  },
  async uploadCV(file) {
    if (!file) return;
    if (file.type !== 'application/pdf') return toast('Please choose a PDF.', 'err');
    if (file.size > 5 * 1024 * 1024) return toast('PDF is larger than 5 MB.', 'err');
    if (!confirm(`Replace ${CONFIG.cvPaths.join(' and ')} with "${file.name}"?`)) return;
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
    try {
      for (const p of CONFIG.cvPaths) {
        let sha;
        try { sha = (await GH.getFile(p)).sha; } catch (e) { if (e.status !== 404) throw e; }
        await GH.putFile(p, b64, `Update ${p} via editor`, sha);
      }
      toast('CV uploaded. Live in about a minute.', 'ok');
    } catch (e) { toast('Upload failed: ' + e.message, 'err'); }
  },

  /* misc */
  showJSON() { document.getElementById('json-area').value = JSON.stringify(this.data, null, 2); document.getElementById('json-modal').classList.add('show'); },
  copyJSON() { navigator.clipboard.writeText(JSON.stringify(this.data, null, 2)).then(() => toast('Copied', 'ok')); },
  download() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this.data, null, 2) + '\n'], { type: 'application/json' }));
    a.download = 'portfolio-data.json'; a.click(); URL.revokeObjectURL(a.href);
  },
  closeModal(id) { document.getElementById(id).classList.remove('show'); },
};

function findSpecFor(panel, key) {
  // key like "research.3" or "cyberArena.platforms.1": find the objects spec whose path matches
  const parentPath = key.replace(/\.\d+$/, '');
  if (panel.type === 'objects' && panel.path === parentPath) return panel;
  const search = (fields, base) => {
    for (const f of fields || []) {
      if (f.type === 'row') { const r = search(f.fields, base); if (r) return r; continue; }
      const p = join(base, f.key);
      if (f.type === 'objects') {
        if (p === parentPath) return f;
        const inner = parentPath.startsWith(p + '.') ? search(f.item, parentPath.slice(0, parentPath.lastIndexOf('.'))) : null;
        if (inner) return inner;
      }
    }
    return null;
  };
  return search(panel.fields, panel.path);
}

function diffPaths(a, b, path = '', out = []) {
  if (JSON.stringify(a) === JSON.stringify(b)) return out;
  const isObj = (x) => x && typeof x === 'object';
  if (isObj(a) && isObj(b) && Array.isArray(a) === Array.isArray(b)) {
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    keys.forEach((k) => diffPaths(a[k], b[k], path ? `${path}.${k}` : k, out));
  } else out.push({ path: path || '(root)', from: a, to: b });
  return out;
}

function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${kind}`;
  clearTimeout(t._h); t._h = setTimeout(() => (t.className = 'toast'), kind === 'err' ? 6000 : 3000);
}

/* ───────── wiring ───────── */
document.getElementById('content').addEventListener('input', (e) => App.onInput(e));
document.getElementById('content').addEventListener('change', (e) => { if (e.target.dataset && (e.target.dataset.bool || e.target.tagName === 'SELECT')) App.onInput(e); });
document.getElementById('sidebar').addEventListener('click', (e) => {
  const a = e.target.closest('a[data-id]'); if (!a) return;
  e.preventDefault(); App.show(a.dataset.id); window.scrollTo(0, 0);
});
document.getElementById('menu-btn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('preview-seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#preview-seg button').forEach((x) => x.classList.toggle('on', x === b));
  App.reloadPreview();
});
document.querySelectorAll('.modal-bg').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show'); }));
window.addEventListener('beforeunload', (e) => { if (diffPaths(App.base, App.data).length) { e.preventDefault(); e.returnValue = ''; } });

async function signIn(token) {
  GH.token = token;
  const user = await GH.api('/user');
  const repo = await GH.api(`/repos/${CONFIG.repo}`);
  if (!repo.permissions || !repo.permissions.push) throw new Error(`@${user.login} cannot push to ${CONFIG.repo}.`);
  try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  App.user = user;
  document.getElementById('who').innerHTML = `<img src="${esc(user.avatar_url)}" alt=""><span>${esc(user.login)}</span>
    <button class="btn btn-ghost btn-sm" type="button" onclick="signOut()">Sign out</button>`;
  await App.start(false);
}
function signOut() {
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  location.hash = ''; location.reload();
}
document.getElementById('gh-login').addEventListener('click', async () => {
  const err = document.getElementById('signin-err'); err.textContent = '';
  try { await signIn(await GH.login()); } catch (e) { err.textContent = e.message; GH.token = null; }
});
document.getElementById('offline-btn').addEventListener('click', () => App.start(true));

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (saved) {
    try { await signIn(saved); } catch (e) { try { sessionStorage.removeItem(TOKEN_KEY); } catch (x) {} }
  }
})();
</script>
