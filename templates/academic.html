  </footer>

  <script>
    (function () {
      var btn = document.querySelector('.theme-btn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        // choosing the system's own theme means "follow the system" again
        try { if (next === sys) localStorage.removeItem('academic-theme-v2'); else localStorage.setItem('academic-theme-v2', next); } catch (e) {}
      });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var saved = null; try { saved = localStorage.getItem('academic-theme-v2'); } catch (x) {}
        if (!saved) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      });
    })();
  </script>
  <script src="js/mode-switch.js?v={{V}}"></script>
  <script type="module">
    // CMS live preview: re-render from unsaved data without a rebuild.
    if (new URLSearchParams(location.search).get('preview') === '1') {
      document.documentElement.classList.add('ms-arrive');
      const { renderMain, renderFooter } = await import('./js/academic-render.js?v={{V}}');
      const apply = (data) => {
        document.getElementById('main').innerHTML = '<span id="top"></span>' + renderMain(data);
        const f = document.querySelector('.site-footer');
        if (f && f.firstElementChild) f.firstElementChild.outerHTML = renderFooter(data);
      };
      try { const s = sessionStorage.getItem('portfolio-preview-data'); if (s) apply(JSON.parse(s)); } catch (e) {}
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin) return;
        if (e.data && e.data.type === 'livePreviewUpdate' && e.data.data) apply(e.data.data);
      });
    }
  </script>
